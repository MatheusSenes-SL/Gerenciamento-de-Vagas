<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="estilos/style.css">
    <title>Cadastro - Parking</title>
</head>

<body>
    <header class="topbar">
        <h1>Parking</h1>
    </header>

    <main class="login-container">
        <div class="icon-wrapper">
            <img src="referencias/Estacionamento_Icon.png" alt="Ícone de estacionamento" class="logo-image">
        </div>

        <h1 class="title">Crie sua conta</h1>
        <p class="subtitle">Preencha os campos abaixo para se cadastrar no sistema</p>

        <!-- Formulário de cadastro -->
        <form class="login-form">
            <input type="text" placeholder="Nome completo" required>
            <input type="email" placeholder="E-mail" required>
            <input type="password" placeholder="Senha" required>
            <input type="password" placeholder="Confirme a senha" required>
            <button type="submit">Cadastrar</button>
        </form>

        <!-- Link para login -->
        <div class="credenciais-box">
            <p>Já tem uma conta?</p>
            <a href="Login.html">Faça login aqui</a>
        </div>
    </main>
</body>

</html>
