<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ícones do Font Awesome (usado para o ícone de carro) -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="estilos/style.css">
    <title>Parking</title>
</head>

<body>

    <header class="topbar">
        <h1>Parking</h1>
    </header>

    <main>

        <main class="login-container">


            <div class="icon-wrapper">
                <img src="referencias/Estacionamento_Icon.png" alt="Ícone de estacionamento" class="logo-image">
            </div>

            <h1 class="title">Sistema de Estacionamento</h1>
            <p class="subtitle">Entre com suas credenciais para acessar o sistema</p>

            <!--Formulario Login-->
            <form class="login-form">
                <input type="email" placeholder="email@dominio.com" required>
                <input type="password" placeholder="Digite sua senha" required>
                <button type="submit">Entrar</button>
            </form>

            <div class="credenciais-box">
                <p>Não possui uma conta?</p>
                <a href="cadastro.html">Faça login aqui</a>
            </div>

        </main>

</body>

</html>
